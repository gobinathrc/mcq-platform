services:
  # Web Service running Node.js + Express backend (which also serves Vite production client)
  - type: web
    name: mcq-assessment-platform
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mcq-postgres
          property: connectionString
      - key: DB_POOL_MAX
        value: 50

databases:
  # Managed PostgreSQL instance on Render
  - name: mcq-postgres
    plan: free
    databaseName: mcq_exam_db
    user: mcq_admin
