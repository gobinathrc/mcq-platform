services:
  # Web Service running Node.js + Express backend (serves API + React frontend)
  - type: web
    name: mcq-assessment-platform
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: 50
